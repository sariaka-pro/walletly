version: '3.8'

services:
  # ── FRONTEND - Angular ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: walletly-frontend
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=production
      - API_URL=http://localhost:8080/api
    depends_on:
      - backend
    networks:
      - walletly-network
    restart: unless-stopped

  # ── BACKEND - Spring Boot ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: walletly-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/walletly?useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - mysql
    networks:
      - walletly-network
    restart: unless-stopped

  # ── DATABASE - MySQL ──
  mysql:
    image: mysql:8.0
    container_name: walletly-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=walletly
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - walletly-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

networks:
  walletly-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
