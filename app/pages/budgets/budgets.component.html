<div class="budgets-page">
  <div class="page-header">
    <h2 class="page-title">Budgets</h2>
    <button class="btn-primary">
      <span class="material-icons btn-icon">add</span>
      New Budget
    </button>
  </div>

  <div class="budgets-grid">
    @for (budget of budgets; track budget.id) {
      <div class="budget-card">
        <div class="budget-card-header">
          <span class="material-icons budget-icon">{{ budget.icon }}</span>
          <div class="budget-info">
            <span class="budget-category">{{ budget.category }}</span>
            <span class="budget-amounts">
              <span [class]="budget.spent > budget.allocated ? 'budget-spent budget-spent--over' : 'budget-spent'">
                {{ budget.spent | number:'1.0-0' }}€
              </span>
              <span class="budget-sep"> / </span>
              <span class="budget-allocated">{{ budget.allocated | number:'1.0-0' }}€</span>
            </span>
          </div>
          <span class="budget-pct" [class.budget-pct--danger]="budget.spent > budget.allocated">
            {{ getProgressPercent(budget) | number:'1.0-0' }}%
          </span>
        </div>
        <div class="progress-track">
          <div
            class="progress-bar"
            [class]="getProgressClass(budget)"
            [style.width.%]="getProgressPercent(budget)"
          ></div>
        </div>
      </div>
    }
  </div>
</div>
