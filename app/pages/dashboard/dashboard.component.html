<div class="dashboard">

  <!-- SUBHEADER -->
  <div class="subheader">
    <div class="subheader-left">
      <!-- Breadcrumbs -->
      <nav class="breadcrumbs">
        @for (item of breadcrumbs; track item.label; let last = $last) {
          @if (!last) {
            <button class="breadcrumb-link">{{ item.label }}</button>
            <span class="breadcrumb-sep">
              <mat-icon>chevron_right</mat-icon>
            </span>
          }
          @if (last) {
            <strong class="breadcrumb-current">{{ item.label }}</strong>
          }
        }
      </nav>
    </div>

    <div class="subheader-right">
      <!-- Tabs -->
      <mat-tab-group class="subheader-tabs" [(selectedIndex)]="selectedTab" animationDuration="150ms">
        <mat-tab label="Default view" />
        <mat-tab label="Details" />
        <mat-tab label="Followers" />
      </mat-tab-group>

      <!-- Actions -->
      <div class="subheader-actions">
        <button mat-stroked-button class="btn-secondary">Secondary</button>
        <button mat-flat-button class="btn-primary">Primary</button>
      </div>
    </div>
  </div>

  <!-- CONTENT GRID -->
  <div class="content-grid">
    @for (card of cards; track card) {
      <!-- Main card -->
      <mat-card class="form-card">
        <mat-card-header>
          <mat-card-title>Registration form</mat-card-title>
          <mat-card-subtitle>Tell us about yourself</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <mat-form-field appearance="fill" class="full-width">
            <mat-label>Name</mat-label>
            <input matInput placeholder="John Wick" [(ngModel)]="nameValue" />
          </mat-form-field>
        </mat-card-content>
        <mat-card-actions>
          <button mat-stroked-button class="btn-secondary">Cancel</button>
          <button mat-flat-button class="btn-primary">Ok</button>
        </mat-card-actions>
      </mat-card>

      <!-- Sidebar card -->
      <mat-card class="sidebar-card">
        <mat-card-header>
          <mat-card-title>Sidebar content</mat-card-title>
          <mat-card-subtitle>Use CSS grid to position</mat-card-subtitle>
        </mat-card-header>
      </mat-card>
    }
  </div>

</div>
