<div class="transactions-page">
  <div class="page-header">
    <h2 class="page-title">Transactions</h2>
    <button class="btn-primary">
      <span class="material-icons btn-icon">add</span>
      Add Transaction
    </button>
  </div>

  <div class="transactions-table-wrapper">
    <table class="transactions-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Description</th>
          <th>Category</th>
          <th class="text-right">Amount</th>
        </tr>
      </thead>
      <tbody>
        @for (tx of transactions; track tx.id) {
          <tr>
            <td class="tx-date">{{ tx.date }}</td>
            <td class="tx-label">{{ tx.label }}</td>
            <td>
              <span class="tx-category">{{ tx.category }}</span>
            </td>
            <td class="text-right">
              <span [class]="tx.type === 'income' ? 'tx-amount tx-amount--income' : 'tx-amount tx-amount--expense'">
                {{ tx.type === 'income' ? '+' : '' }}{{ tx.amount | number:'1.2-2' }}€
              </span>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
